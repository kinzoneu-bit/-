<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选品全链路看板 · KinZon</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #f4f7fb; }

      /* 浅色 · 清爽：(KK 2026-11-27) 全局字重抬到 500，小字默认就粗一档，不用逐处改 */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                     'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
        font-weight: 500;
        color: #18222e;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* 表单控件继承字重与字体，避免回落成系统默认细体 */
      button, input, select, textarea, label, th, td {
        font-family: inherit;
        font-weight: inherit;
        letter-spacing: inherit;
      }

      ::selection { background: rgba(15,139,126,.18); color: #0b3f39; }

      /* 浅色滚动条 */
      * { scrollbar-width: thin; scrollbar-color: #c3cfdd transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #c9d4e2; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #a9b8ca; background-clip: content-box; }

      /* 日期/月份图标在浅底上可见 */
      ::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }
      ::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
